# Hermes settings for one shop's assistant. The repo is the source of truth: entrypoint.sh copies this to
# HERMES_HOME at every start. Secrets are never written here; ${NAME} is read from the container environment.
model:
  provider: openrouter
  default: google/gemini-3.1-flash-lite

# Only a provider that OpenRouter lists as zero-data-retention for this model may answer, and none that may
# store data. Change the model and the provider together (see README).
provider_routing:
  only: [google-vertex]
  data_collection: deny
  require_parameters: true

mcp_servers:
  aibcc:
    command: /opt/hermes/.venv/bin/python
    args: ["/assistant/aibcc_mcp.py"]
    env:
      AIBCC_URL: "${AIBCC_URL}"
      AIBCC_TOKEN: "${AIBCC_TOKEN}"
      WEB_SEARCH_API_KEY: "${WEB_SEARCH_API_KEY}"
      WEB_SEARCH_FALLBACK_KEY: "${WEB_SEARCH_FALLBACK_KEY}"
      WEB_SEARCH_PROVIDER: "${WEB_SEARCH_PROVIDER}"
      WEB_SEARCH_FALLBACK_PROVIDER: "${WEB_SEARCH_FALLBACK_PROVIDER}"
      WEB_SEARCH_DAILY_CAP: "${WEB_SEARCH_DAILY_CAP}"
      # The shop's own API is reached directly, but a web search has to go out through the allow-list proxy; a stdio MCP server
      # starts with a clean environment, so the proxy settings must be handed to it here.
      HTTPS_PROXY: "${HTTPS_PROXY}"
      HTTP_PROXY: "${HTTP_PROXY}"
      NO_PROXY: "${NO_PROXY}"

# Telegram: only the people named in TELEGRAM_ALLOWED_USERS may message the bot, and only in a private chat. Anyone
# else is ignored. (entrypoint.sh also refuses to start Telegram at all when that list is empty.)
platforms:
  telegram:
    dm_policy: allowlist
    group_policy: disabled
    # Hermes tells the chat "shutting down" and "back online" at every restart, including the daily 04:00 maintenance. For
    # an owner that is an alarming message in the middle of the night.
    gateway_restart_notification: false
    # Slash commands (/model, /moa, /update, /cron, /debug, /learn ...) can change the model, send a question to other
    # providers, install skills or upload a debug report. Gating turns on when any admin is listed, so the single admin
    # below is an id no account can have: nobody is an admin, and everyone allowed to chat gets /help, /whoami and
    # the commands listed (/new starts a fresh conversation; /reset is its alias).
    allow_admin_from: ["0"]
    # /start is what Telegram sends when someone opens the bot for the first time; it needs to be allowed or the owner's
    # first screen is "admin-only". It answers nothing.
    user_allowed_commands: [new, start]
    # The "/" menu in the chat lists only what the owner may run, not every Hermes command.
    extra:
      command_menu:
        max_commands: 3
        priority_mode: replace
        priority: [new, help, whoami]

# /new asks "approve once / always / cancel" before it resets a conversation. An owner should not see that.
approvals:
  destructive_slash_confirm: false

# A file reaches the chat only from the outbox (where make_file writes) or from the folders where Hermes keeps what the owner
# sent: nothing else on the machine can be delivered, whatever path a reply names, and a fresh file elsewhere is not trusted.
gateway:
  strict: true
  media_delivery_allow_dirs: [/opt/data/outbox]
  trust_recent_files: false

# Built-in toolsets are chosen per channel: every channel must be listed or it gets the defaults
# (web, browser, terminal, file, code execution). Verify with: hermes tools list --platform <channel>
platform_toolsets:
  cli: [memory]
  api_server: [memory]
  telegram: [memory]

tools:
  tool_search:
    enabled: "off"

# The default INFO level writes the first part of every question into agent.log. Warnings and errors only.
logging:
  level: WARNING
  max_size_mb: 5
  backup_count: 3

# Memory holds the owner's preferences and vocabulary only (SOUL.md says so; maintain.sh enforces it every day).
# The background review that writes memory runs as a fork of the same model, which inherits the provider pin above
# (agent/background_review.py, _PROVIDER_PIN_ATTRS). Not verified end to end: OpenRouter shows no per-call provider.
memory:
  memory_enabled: true
  user_profile_enabled: true

# Skills the agent writes for itself stay off for now (no skill toolset, no creation nudges): a self-written
# procedure could outrank the numeric rules in SOUL.md. Revisit after memory has run for a while.
skills:
  creation_nudge_interval: 0

# These call a model with the conversation and cannot be bound by the provider pin (the auxiliary client does not read
# provider_routing), so they stay off.
auxiliary:
  title_generation:
    enabled: false
compression:
  enabled: false
