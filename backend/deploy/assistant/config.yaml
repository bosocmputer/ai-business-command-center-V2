# Hermes settings for one shop's assistant. The repo is the source of truth: entrypoint.sh copies this to
# HERMES_HOME at every start. Secrets are never written here; ${NAME} is read from the container environment.
model:
  provider: openrouter
  default: google/gemini-3.1-flash-lite

# Only a provider that OpenRouter lists as zero-data-retention for this model may answer, and none that may
# store data. Change the model and the provider together (see README).
provider_routing:
  only: [google-vertex]
  data_collection: deny
  require_parameters: true

mcp_servers:
  aibcc:
    command: /opt/hermes/.venv/bin/python
    args: ["/assistant/aibcc_mcp.py"]
    env:
      AIBCC_URL: "${AIBCC_URL}"
      AIBCC_TOKEN: "${AIBCC_TOKEN}"

# Telegram: only the people named in TELEGRAM_ALLOWED_USERS may message the bot, and only in a private chat. Anyone
# else is ignored. (entrypoint.sh also refuses to start Telegram at all when that list is empty.)
platforms:
  telegram:
    dm_policy: allowlist
    group_policy: disabled

# Built-in toolsets are chosen per channel: every channel must be listed or it gets the defaults
# (web, browser, terminal, file, code execution). Verify with: hermes tools list --platform <channel>
platform_toolsets:
  cli: [memory]
  api_server: [memory]
  telegram: [memory]

tools:
  tool_search:
    enabled: "off"

# The default INFO level writes the first part of every question into agent.log. Warnings and errors only.
logging:
  level: WARNING
  max_size_mb: 5
  backup_count: 3

# Memory holds the owner's preferences and vocabulary only (SOUL.md says so; maintain.sh enforces it every day).
# The background review that writes memory runs as a fork of the same model, which inherits the provider pin above
# (agent/background_review.py, _PROVIDER_PIN_ATTRS). Not verified end to end: OpenRouter shows no per-call provider.
memory:
  memory_enabled: true
  user_profile_enabled: true

# Skills the agent writes for itself stay off for now (no skill toolset, no creation nudges): a self-written
# procedure could outrank the numeric rules in SOUL.md. Revisit after memory has run for a while.
skills:
  creation_nudge_interval: 0

# These call a model with the conversation and cannot be bound by the provider pin (the auxiliary client does not read
# provider_routing), so they stay off.
auxiliary:
  title_generation:
    enabled: false
compression:
  enabled: false
